name: Mise à jour llama.cpp (Manuel)

on:
  workflow_dispatch:

concurrency:
  group: cd-llamacpp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-llama:
    name: Compilation llama.cpp sur EC2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Recompilation de llama-server avec rollback
        run: |
          VERSION=$(cat infra/llama.version | tr -d '\r\n')
          echo "Recompilation de llama.cpp à la version $VERSION..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s << 'EOF'
            set -euo pipefail
            BASE_DIR="/home/ubuntu/ouroboros"
            LLAMA_DIR="$BASE_DIR/llama.cpp"
            BIN_PATH="$LLAMA_DIR/build/bin/llama-server"
            
            if [ -f "$BIN_PATH" ]; then
              cp "$BIN_PATH" "$BIN_PATH.previous"
            fi

            cd "$LLAMA_DIR"
            git fetch --tags
            # Checkout commit ou tag
            VERSION=$(cat "$BASE_DIR/infra/llama.version" 2>/dev/null || echo "master")
            git checkout "$VERSION" || true
            
            cmake -B build
            cmake --build build --config Release -j2 --target llama-server

            echo "Redémarrage de ouroboros-llm..."
            sudo systemctl restart ouroboros-llm || true
            
            # Vérification de santé
            sleep 5
            if curl -s -f http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "llama-server opérationnel !"
            else
              echo "Échec du nouveau binaire. Restauration du binaire précédent..."
              if [ -f "$BIN_PATH.previous" ]; then
                cp "$BIN_PATH.previous" "$BIN_PATH"
                sudo systemctl restart ouroboros-llm || true
              fi
              exit 1
            fi
EOF
