[project]
name = "univers"
version = "0.1.0"
description = "Simulateur récursif d'univers - backend (moteur + IA)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
ai = ["huggingface_hub>=0.25"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
